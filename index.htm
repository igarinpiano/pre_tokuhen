<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="shortcut icon" href="to.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>特編の時間割のページ</title>
    <style>
        :root{
            --bg: #000;
            --fc: #fff;
            --bg2: #400;
            --fc2: #0ff;
            --fc3: #aaa;
        }
        *{
            font-size: 7vw;
            font-family: sans-serif;
        }
        @media (min-aspect-ratio: 7/10) {
          *{
            font-size: 4.9vh;
          }
        }
        body{
            text-align: center;
            background-color:var(--bg);
            color:var(--fc);
        }
        #titlebar{
            width: 100vw;
            margin-left: calc(50% - 50vw);
            margin-right: calc(50% - 50vw);
            padding:0px;
            background: linear-gradient(to bottom,#367feb,  #55a4fe 8%, #0058e6 25%, #0167fb 80%,#1553d2);
            text-align:center;
        }
        #mainMoji{
            display:inline;
            padding:0px;
            margin:0px;
            font-size:0.8rem; 
            font-family:serif;
            font-weight:900;
            color:#ffffff;
            text-shadow:2px 2px 0 #000000;
        }
        #tab{
            width:90vw;
            margin:auto;
            border-collapse: collapse;
        }
        #toggle{
            width:50vw;
            padding:10px;
        }
        th,td{
            border: 1px solid var(--fc);
            font-weight:900;
        }
        th{
            background-color:var(--bg2);
            color:var(--fc2);
            font-weight:900;
        }
        tr{
            height:2rem;
            font-weight:900;
        }

        #mob-con{
            display:flex; 
            gap:8px; 
            justify-content:space-around; 
            align-items:center;
            position:fixed; 
            left:0; 
            right:0; 
            bottom:0;
            padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));
            border-top:1px solid #fff;
        }
        #mob-con button{
            flex:1; 
            font-size:1.5rem;
            height:10vh;
        }
        button{
            cursor:pointer; 
            border:1px solid var(--border); 
            border-radius:3px; 
            background: linear-gradient(to bottom,#fff,  #e4e4d9 80%,  #cfcfbf);
            color:var(--fg); 
            padding:4px 8px; 
            font-size:0.85rem;
            color:black;
        
        }
        button:hover{
            border:1px solid #000;
            outline:3px solid #f3c44b;
            outline-offset:-4px;
            color:black;
        }
        button:active{
            background: linear-gradient(to bottom,#cfcfbf,  #e4e4d9 20%,  #fff);
            border:1px solid #000;
            outline:3px solid #f3c44b;
            outline-offset:-4px;
            color:black;
        }
        button:disabled{
            opacity:0.6; cursor:default;
            color:black;
        }
        #lightmode{
            height:1rem;
            width:1rem;
        }
        
    </style>
    
</head>
<body>

<div id="titlebar">
    <img src="./to.png" style="display:inline;height:0.8rem;">
    <p id="mainMoji">前期特編時間割表示システム</p>

</div>



<table id="tab">
  <caption style="font-size:0.8rem;" id="cap">(組と講座を下で設定)</caption>
  <colgroup>
    <col style="width: 3rem;">
  </colgroup>
  <thead>
    <tr id="tr">
      <th >時限</th>
      <th id="date">11/30</th>
    </tr>
  </thead>
  <tbody id="tabbody">
  </tbody>
</table>


    <div id="main">

<br>
<hr>
<div style="text-align:left">
<label>組：<select id="kumi" >
  <option value="1"         >1</option>
  <option value="2"         >2</option>
  <option value="3"         >3</option>
  <option value="4"         >4</option>
  <option value="5"         >5</option>
  <option value="6" selected>6</option>
  <option value="7"         >7</option>
  <option value="8"         >8</option>
</select>
</label>

<br>
<label>講座：<select id="koza" >
  <option value="a"         >A</option>
  <option value="b"         >B</option>
  <option value="c"         >C</option>
  <option value="k"         >K</option>
  <option value="l" selected>L</option>
  <option value="m"         >M</option>
  <option value="n"         >N</option>
  <option value="o"         >O</option>
</select>
</label>

<br>
<label>ライトモード：
    <input type="checkbox" id="lightmode" switch checked>
</label>

</div>

<br>

<div id="mob-con">
    
  <button id="m-left">← 前</button>
  <button id="m-right">次 →</button>
</div>
    </div>

</body>
</html>
